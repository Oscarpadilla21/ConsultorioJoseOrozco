<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="José Orozco — Clínica de Estética Dental">
  <defs>
    <linearGradient id="cardTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3cb5a5" />
      <stop offset="100%" stop-color="#2a9d8f" />
    </linearGradient>
  </defs>
  <!-- Caja Cuadrada Teal de la Tarjeta Real -->
  <rect x="10" y="10" width="220" height="180" rx="14" fill="url(#cardTeal)" />
  
  <!-- Texto José -->
  <text x="50" y="78" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="300" letter-spacing="1">José</text>
  <!-- Línea vertical de la J que baja sutilmente -->
  <path d="M52 46 v42 c0 14 -10 24 -24 24" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Círculo O con Sonrisa Real de la Tarjeta -->
  <circle cx="56" cy="122" r="24" fill="none" stroke="#ffffff" stroke-width="4.5" />
  <!-- Sonrisa interior -->
  <path d="M46 124 c5 8 15 8 20 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="48" cy="116" r="2.2" fill="#ffffff" />
  <circle cx="64" cy="116" r="2.2" fill="#ffffff" />
  
  <!-- Texto rozco -->
  <text x="84" y="134" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="38" font-weight="300" letter-spacing="1">rozco</text>
  
  <!-- Cinta Azul Marina Inferior: CLÍNICA DE ESTÉTICA DENTAL -->
  <rect x="10" y="152" width="220" height="38" rx="0" fill="#0f2b46" />
  <text x="120" y="176" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.8">CLÍNICA DE ESTÉTICA DENTAL</text>
</svg>
